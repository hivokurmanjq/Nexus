name = "nexus"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
OWNER_ID = "0"
BOT_USERNAME = ""
WORKER_URL = ""
MINI_APP_URL = ""

# ── KV Namespace (برای کش) ──
[[kv_namespaces]]
binding = "CACHE"
id = "7373a17665743934a7936f26abe2e5dd"

# ── D1 Database ──
[[d1_databases]]
binding = "DB"
database_name = "nexus-guard-db"
database_id = "f4553e03-e484-41c7-9219-5325c3ea2580"

# ── Workers AI ──
[ai]
binding = "AI"
