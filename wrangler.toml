name = "nexus"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
OWNER_ID = "0"
BOT_USERNAME = ""
WORKER_URL = ""
MINI_APP_URL = ""

# ── KV Namespace (برای کش) ──
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID"

# ── D1 Database ──
[[d1_databases]]
binding = "DB"
database_name = "nexus-db"
database_id = "REPLACE_WITH_D1_ID"

# ── Workers AI ──
[ai]
binding = "AI"
